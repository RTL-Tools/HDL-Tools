# Push a tag like v0.0.1 to build the extension pack, publish it to the Marketplace and create the GitHub release.
# Marketplace auth is trusted publishing (OIDC): the publisher HDL-Tools has a policy naming this repo and this exact filename (publish.yaml), so there is no token secret.
name: Publish
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub release
      id-token: write   # OIDC token for Marketplace trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npx --yes @vscode/vsce@4.1.0 package
      - name: Publish to Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath hdl-tools-*.vsix
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" hdl-tools-*.vsix --title "HDL Tools $GITHUB_REF_NAME" --generate-notes
